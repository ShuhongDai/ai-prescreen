# The report, hit-count and usage-statistics API at https://api.aiprescreen.fyi, and the
# dashboard at https://api.aiprescreen.fyi/dashboard. Deployed by CI
# (.github/workflows/deploy-worker.yml). Secrets, set once with `wrangler secret put`:
#   GITHUB_TOKEN      fine-grained token: Issues read/write on ShuhongDai/ai-prescreen only
#   TURNSTILE_SECRET  secret key of the Turnstile widget for aiprescreen.fyi
#   STATS_TOKEN       the dashboard's access token (random; a copy in .env)
# Local development: copy .dev.vars.example to .dev.vars (Turnstile test keys, dry run).

name = "aiprescreen-api"
main = "src/index.ts"
compatibility_date = "2026-10-23"

# Only the custom domain; no *.workers.dev or preview URLs.
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.aiprescreen.fyi", custom_domain = true }]

# Generated into worker/src/generated/ (not committed): the set of lexicon entry IDs the
# Worker accepts, and the dashboard's files from worker/dashboard/. The command runs in
# wrangler's working directory: use the npm scripts (project root). `wrangler dev` reruns
# it when the lexicon or the dashboard changes; source files are watched anyway.
[build]
command = "node scripts/worker-entry-ids.ts && node --disable-warning=ExperimentalWarning scripts/worker-dashboard.ts"
watch_dir = ["../lexicon", "dashboard"]

[vars]
GITHUB_REPO = "ShuhongDai/ai-prescreen"
ALLOWED_ORIGINS = "https://aiprescreen.fyi"
TURNSTILE_HOSTNAMES = "aiprescreen.fyi"
# Issues the Worker opens per UTC day and report kind at most, over all clients.
REPORTS_PER_DAY = "30"
# Rows written for hit counts per UTC day at most (the budget row included): D1's free write
# quota (100,000 rows a day) is shared by the whole Cloudflare account.
HITS_ROWS_PER_DAY = "20000"
# Rows written for usage statistics per UTC day at most (about 3,000 visits), the budget row
# included; also within the account's shared write quota.
ANALYTICS_ROWS_PER_DAY = "30000"
# Rows the dashboard may read per UTC day (D1's free read quota, 5 million a day, is the
# account's; hits and reports need some too).
STATS_ROWS_READ_PER_DAY = "1500000"

[[d1_databases]]
binding = "DB"
database_name = "aiprescreen-db"
database_id = "4fad06f0-8685-4189-b4b9-333951d2d333"
migrations_dir = "migrations"

# Per client (a salted hash of the IP or an IPv6 /64, see src/limits.ts) and per minute.
[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "4101"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "HITS_LIMIT"
namespace_id = "4102"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "COLLECT_LIMIT"
namespace_id = "4103"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "STATS_LIMIT"
namespace_id = "4104"
simple = { limit = 20, period = 60 }

# Shortly after midnight UTC: deletes the previous day's salt, writes the daily totals of the
# last two days, deletes visits older than 400 days.
[triggers]
crons = ["5 0 * * *"]

# Off on purpose: request logs would keep visitors' IP addresses.
[observability]
enabled = false

# `npm run worker:dev`: 8787 is taken on the shared headnode (RStudio Server).
[dev]
ip = "127.0.0.1"
port = 8788
